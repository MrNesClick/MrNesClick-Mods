site_name: MrNesClick's Minecraft mods
site_description: Documentation of the Minecraft mods by MrNesClick
site_url: https://mrnesclick.github.io/MrNesClick-Mods/
repo_url: https://github.com/MrNesClick/MrNesClick-Mods
repo_name: Issues and suggestions
edit_uri: ""

validation:
  anchors: warn

theme:
  name: material
  language: en
  icon:
    logo: material/minecraft
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Generated pages (tools/config_reference.py) are included from tools/generated, outside docs/.
  - pymdownx.snippets:
      base_path: [tools/generated]
      check_paths: true

nav:
  - Home: index.md
  - Mekanistic Geothermal:
      - mekanistic-geothermal/index.md
      - Getting started: mekanistic-geothermal/getting-started.md
      - The wellhead: mekanistic-geothermal/wellhead.md
      - Safety: mekanistic-geothermal/safety.md
      - Upgrades: mekanistic-geothermal/upgrades.md
      - Logic adapter: mekanistic-geothermal/logic-adapter.md
      - Configuration: mekanistic-geothermal/config.md
      - Commands: mekanistic-geothermal/commands.md
  - Flux Networks Extended:
      - flux-networks-extended/index.md
      - Tiered Plugs and Points: flux-networks-extended/devices.md
      - Upgrade kits: flux-networks-extended/upgrade-kits.md
      - Mekanism integration: flux-networks-extended/mekanism.md
      - Configuration: flux-networks-extended/config.md
  - MCNesclick:
      - mcnesclick/index.md
      - Apples: mcnesclick/apples.md
      - Campfire protection: mcnesclick/campfire-protection.md
      - Configuration: mcnesclick/config.md
