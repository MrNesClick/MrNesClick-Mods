name: Suggestion
description: An idea or an improvement for one of the mods
labels: ["suggestion"]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options:
        - Flux Networks Extended
        - MCNesClick
        - Mekanistic Geothermal
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you would like, and why it would help you.
    validations:
      required: true
